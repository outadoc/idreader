name: Deploy apps

on:
  release:
    types:
      - released

jobs:
  deploy-android:
    name: Deploy Android app
    runs-on: ubuntu-latest
    environment: deploy

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y.%m')" >> $GITHUB_OUTPUT

      - name: Compute unique version code
        id: version
        run: echo "version=$(git rev-list HEAD --count)" >> $GITHUB_OUTPUT

      - name: Build APK
        run: |
          ./gradlew assembleRelease \
          "-PexternalVersionName=${{ steps.date.outputs.date }}.${{ steps.version.outputs.version }}" \
          "-PexternalVersionCode=${{ steps.version.outputs.version }}" \
          "-PenableLogging=false"

      - name: List available Android build tools
        run: ls -l /usr/local/lib/android/sdk/build-tools/

      - uses: r0adkll/sign-android-release@v1
        name: Sign app APK
        id: sign_app
        with:
          releaseDirectory: androidApp/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ vars.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Upload APK to GitHub
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Update GitHub release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ github.event.release.name }}
          artifacts: ${{ steps.sign_app.outputs.signedReleaseFile }}
          allowUpdates: true
          draft: false
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          replacesArtifacts: false

  deploy-ios:
    name: Deploy iOS app
    environment: deploy
    runs-on: macos-26

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Select Xcode version
        run: sudo xcode-select -s '/Applications/Xcode_26.1.1.app/Contents/Developer'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y.%m')"

      - name: Compute unique version code
        id: version
        run: echo "::set-output name=version::$(git rev-list HEAD --count)"

      - name: Set up Mise
        uses: jdx/mise-action@v3
        with:
          install: false

      - name: Install Mise dependencies
        run: mise install
        working-directory: iosApp

      - name: Install dependencies
        run: tuist install
        working-directory: iosApp

      - name: Generate Xcode project
        run: tuist generate
        working-directory: iosApp
        env:
          # CFBundleVersion is the commit count
          TUIST_VERSION_CODE: "${{ steps.version.outputs.version }}"
          # CFBundleShortVersionString is based on the date and commit count
          TUIST_VERSION_NAME: "${{ steps.date.outputs.date }}.${{ steps.version.outputs.version }}"

      - name: Setup Match repository credentials
        run: echo "${MATCH_DEPLOY_KEY}" | ssh-add -
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Build shared framework
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Download App Store Connect API key
        run: echo "$APPLE_DEV_PORTAL_API_KEY" > /tmp/appstore-api-key.p8
        env:
          APPLE_DEV_PORTAL_API_KEY: ${{ secrets.APPLE_DEV_PORTAL_API_KEY }}

      - name: Run Fastlane
        run: fastlane beta
        working-directory: iosApp
        env:
          MATCH_PASSWORD: ${{ secrets.FASTLANE_MATCH_PASSWORD }}
